<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dota 2 Helper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#111827;--card:#1a2236;--card2:#222d45;--red:#e74c3c;--gold:#f0b232;--green:#2ecc71;--blue:#3498db;--cyan:#00d4ff;--txt:#e8e6e3;--txt2:#8892a4;--txt3:#5a6478;--brd:#2a3550}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(0,212,255,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(231,76,60,.05) 0%,transparent 50%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:68px}
.header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--brd);background:linear-gradient(180deg,rgba(10,14,26,.97),rgba(10,14,26,.85));backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.header-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--red),#c0392b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);box-shadow:0 3px 12px rgba(231,76,60,.3)}
.header h1{font-family:'Orbitron';font-size:15px;font-weight:700;letter-spacing:1px}
.header span{font-size:11px;color:var(--txt2)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:rgba(17,24,39,.96);backdrop-filter:blur(15px);border-top:1px solid var(--brd);z-index:100;padding:2px 0 4px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:none;border:none;color:var(--txt3);font-family:'Exo 2';font-size:10px;font-weight:600;cursor:pointer;transition:.3s;position:relative}
.nb.a{color:var(--cyan)}.nb.a::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--cyan);border-radius:0 0 2px 2px;box-shadow:0 0 8px var(--cyan)}
.ni{font-size:18px}
.page{display:none;padding:16px 12px;animation:fi .25s ease}.page.a{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.st{font-family:'Orbitron';font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.pb{margin-left:auto;background:var(--red);color:#fff;padding:2px 8px;border-radius:20px;font-family:'Orbitron';font-size:10px;font-weight:700;box-shadow:0 2px 8px rgba(231,76,60,.3)}
.hg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:20px}
.hc{border-radius:8px;overflow:hidden;cursor:pointer;transition:.25s;border:1px solid transparent;background:var(--card)}.hc:active{transform:scale(.95)}
.ha{width:100%;aspect-ratio:1.7;overflow:hidden;background:var(--card)}
.ha img{width:100%;height:100%;object-fit:cover}
.hn{font-size:7.5px;text-align:center;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt2);font-weight:600}
.hw{font-size:10px;font-weight:700;text-align:center;padding:2px 0 3px}
.hw.h{color:var(--green)}.hw.m{color:var(--gold)}.hw.l{color:var(--red)}
.rf{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.rb{padding:5px 12px;border-radius:20px;border:1px solid var(--brd);background:var(--card);color:var(--txt2);font-family:'Exo 2';font-size:11px;font-weight:600;cursor:pointer;transition:.3s}
.rb.a{background:var(--cyan);color:var(--bg);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.25)}
.hs{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);font-family:'Exo 2';font-size:14px;outline:none;margin-bottom:10px;transition:.3s}
.hs:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.12)}.hs::placeholder{color:var(--txt3)}
.tr{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.tl{font-family:'Orbitron';font-size:9px;font-weight:700;letter-spacing:1px;width:44px;text-align:center;padding:4px 2px;border-radius:6px}
.tl.r{color:var(--green);background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.25)}
.tl.d{color:var(--red);background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25)}
.ps{display:flex;gap:5px;flex:1}
.sl{width:46px;height:46px;border-radius:8px;border:2px dashed var(--brd);display:flex;align-items:center;justify-content:center;color:var(--txt3);cursor:pointer;transition:.3s;background:var(--card);position:relative;overflow:hidden;font-size:18px}
.sl:hover{border-color:var(--cyan)}.sl.f{border-style:solid;border-color:var(--cyan);padding:0}
.sl.f img{width:100%;height:100%;object-fit:cover}
.sl .x{position:absolute;top:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2}
.sl.f .x{display:flex}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:220px;overflow-y:auto;padding:2px;margin-bottom:14px}
.sg::-webkit-scrollbar{width:3px}.sg::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
.sp{aspect-ratio:1.7;border-radius:5px;border:1px solid var(--brd);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;overflow:hidden;padding:0}
.sp:hover{border-color:var(--cyan);transform:scale(1.08)}.sp.pk{opacity:.2;pointer-events:none}
.sp img{width:100%;height:100%;object-fit:cover}
.rec{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--brd);margin-top:12px}
.rct{font-family:'Orbitron';font-size:11px;font-weight:700;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rh{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(42,53,80,.5)}.rh:last-child{border-bottom:none}
.ri{width:36px;height:36px;border-radius:6px;overflow:hidden;flex-shrink:0}.ri img{width:100%;height:100%;object-fit:cover}
.rn{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{font-size:10px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw{font-weight:700;font-size:13px;color:var(--green);flex-shrink:0}
.mt{display:flex;gap:3px;background:var(--card);border-radius:10px;padding:3px;margin-bottom:14px;border:1px solid var(--brd)}
.mb{flex:1;padding:7px;border-radius:8px;border:none;background:transparent;color:var(--txt2);font-family:'Exo 2';font-size:12px;font-weight:600;cursor:pointer;transition:.3s}
.mb.a{background:var(--cyan);color:var(--bg);box-shadow:0 2px 8px rgba(0,212,255,.25)}
.qc{background:var(--card);border-radius:14px;padding:20px 16px;border:1px solid var(--brd)}
.qp{display:flex;gap:3px;margin-bottom:16px}.qd{flex:1;height:3px;border-radius:2px;background:var(--brd);transition:.3s}
.qd.dn{background:var(--cyan);box-shadow:0 0 6px rgba(0,212,255,.3)}.qd.cu{background:var(--gold);box-shadow:0 0 6px rgba(240,178,50,.3)}
.qq{font-size:15px;font-weight:700;margin-bottom:16px;line-height:1.4}
.qo{display:block;width:100%;padding:12px 14px;margin-bottom:7px;border-radius:10px;border:1px solid var(--brd);background:var(--bg2);color:var(--txt);font-family:'Exo 2';font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:.3s}
.qo:hover{border-color:var(--cyan);background:var(--card2);transform:translateX(3px)}.qo:active{transform:scale(.97)}
.qres{text-align:center}
.qrh{width:100px;height:60px;border-radius:10px;overflow:hidden;margin:0 auto 12px;box-shadow:0 4px 20px rgba(0,212,255,.2)}.qrh img{width:100%;height:100%;object-fit:cover}
.qrn{font-family:'Orbitron';font-size:20px;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,var(--cyan),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.qrd{color:var(--txt2);font-size:13px;line-height:1.5;margin-bottom:16px}
.qrb{padding:10px 28px;border-radius:25px;border:none;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;font-family:'Orbitron';font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 3px 15px rgba(0,212,255,.3)}
.wb{background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(231,76,60,.08));border:1px solid var(--brd);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center}
.wb h2{font-family:'Orbitron';font-size:16px;margin-bottom:4px}.wb p{color:var(--txt2);font-size:12px}
.ag{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ac{border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--brd);cursor:pointer;transition:.2s}
.ac:hover{border-color:var(--cyan)}.ac img{width:100%;aspect-ratio:1.7;object-fit:cover;display:block}
.acn{font-size:7px;text-align:center;padding:1px 2px;color:var(--txt2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acw{font-size:9px;font-weight:700;text-align:center;padding:1px 0 2px}
/* Popup */
.po{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}.po.v{display:flex}
.pp{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:90%;border:1px solid var(--brd);position:relative;animation:pi .2s ease}
@keyframes pi{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.pc{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--txt2);font-size:20px;cursor:pointer}
.ph{display:flex;gap:14px;margin-bottom:14px}
.pm{width:80px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0}.pm img{width:100%;height:100%;object-fit:cover}
.pi h3{font-family:'Orbitron';font-size:13px;margin-bottom:3px}
.pi .pr{font-size:11px;color:var(--cyan);font-weight:600}.pi .pa{font-size:11px;color:var(--txt2)}
.pst{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.psi{background:var(--bg2);border-radius:8px;padding:8px;text-align:center}
.psl{font-size:10px;color:var(--txt3);margin-bottom:2px}.psv{font-size:16px;font-weight:700}
.psub{font-size:10px;color:var(--txt3);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.ptg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pt{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;background:var(--bg2);color:var(--txt2);border:1px solid var(--brd)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-logo">D2</div>
    <div><h1>DOTA HELPER</h1><span>Патч 7.41a — Дота-помощник</span></div>
  </div>
  <div class="page a" id="p-meta">

<script>
// Valve CDN key mapping (npc_dota_hero_ names from Steam API)
const VK={lifestealer:"life_stealer",wraith_king:"skeleton_king",anti_mage:"antimage",
shadow_fiend:"nevermore",nature_prophet:"furion",necrolyte:"necrolyte",
outworld_destroyer:"obsidian_destroyer",queen_of_pain:"queenofpain",
clockwerk:"rattletrap",underlord:"abyssal_underlord",zeus:"zuus",io:"wisp",
doom_bringer:"doom_bringer",windrunner:"windrunner",treant:"treant",
vengeful_spirit:"vengefulspirit",centaur:"centaur_warrunner"};
const vk=k=>VK[k]||k;
// CDN URLs — multiple fallbacks (will work on GitHub Pages, blocked in iframe preview)
const CDNS=[
  k=>`https://cdn.akamai.steamstatic.com/apps/dota2/images/dota_react/heroes/${vk(k)}.png`,
  k=>`https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${vk(k)}.png`,
  k=>`https://cdn.dota2.com/apps/dota2/images/heroes/${vk(k)}_lg.png`,
];
const IMG=k=>CDNS[0](k);
// Color map by attribute
const ACOL={str:'linear-gradient(135deg,#8b2020,#c0392b)',agi:'linear-gradient(135deg,#1a6b2a,#27ae60)',int:'linear-gradient(135deg,#1a3a6b,#2980b9)',uni:'linear-gradient(135deg,#6b3a8b,#8e44ad)'};
function heroInitials(k){
  const h=byK(k);if(!h)return'?';
  const words=h.n.split(' ');
  if(words.length>=2)return(words[0][0]+words[1][0]).toUpperCase();
  return h.n.substring(0,2).toUpperCase();
}
function imgErr(el,k){
  const t=parseInt(el.dataset.try||'0')+1;
  if(t<CDNS.length){el.dataset.try=t;el.src=CDNS[t](k);return}
  // Fallback: colored avatar with hero initials
  const h=byK(k);
  const col=h?ACOL[h.a]||ACOL.uni:ACOL.uni;
  const ini=heroInitials(k);
  const p=el.parentElement;
  p.innerHTML=`<div style="width:100%;height:100%;background:${col};display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5);letter-spacing:1px">${ini}</div>`;
}

{k:"lifestealer",n:"Lifestealer",a:"str",rl:"carry",wr:52.62,pr:16,tags:["bkb","lifesteal","melee","tank"],cnt:["Halberd","Razor"],syn:["Slardar","Magnus"]},

{k:"juggernaut",n:"Juggernaut",a:"agi",rl:"carry",wr:51.8,pr:13,tags:["heal","versatile","melee"],cnt:["Ghost Scepter","Axe"],syn:["Crystal Maiden","Shadow Shaman"]},

const ROLES={carry:{l:"КЕРРИ",i:"⚔️"},mid:{l:"МИД",i:"🎯"},offlane:{l:"ОФФЛЕЙН",i:"🛡️"},sup4:{l:"ЧЕТВЁРКА",i:"🔮"},sup5:{l:"ПЯТЁРКА",i:"💚"}};

// ===== HELPERS =====
function wc(w){return w>=53?'h':w>=50?'m':'l'}
function byK(k){return H.find(h=>h.k===k)}

// ===== META =====
function initRF(){
  document.getElementById('rf').innerHTML=["Все","Herald","Guardian","Crusader","Archon","Legend","Ancient","Divine","Immortal"].map((r,i)=>
    `<button class="rb${i===0?' a':''}" onclick="selRank(this,${i})">${r}</button>`
  ).join('');
}
// Rank adjustments — lower ranks have different meta
const RANK_ADJ={
  0:{},// Все — без изменений
  1:{spectre:-3,meepo:-8,wraith_king:+2,sniper:+4,phantom_assassin:+3,bristleback:+2,ogre_magi:+2,lich:+2,riki:+3,bloodseeker:+2},// Herald
  2:{spectre:-2,meepo:-6,wraith_king:+1,sniper:+3,phantom_assassin:+2,bristleback:+1,ogre_magi:+1,lich:+1,riki:+2},// Guardian
  3:{spectre:-1,meepo:-4,sniper:+2,phantom_assassin:+1,riki:+1},// Crusader
  4:{meepo:-2,sniper:+1},// Archon
  5:{},// Legend
  6:{meepo:+1,invoker:+1,earth_spirit:+2},// Ancient
  7:{meepo:+2,invoker:+2,earth_spirit:+3,doom_bringer:+2,io:+4,chen:+2},// Divine
  8:{meepo:+3,invoker:+3,earth_spirit:+4,doom_bringer:+3,io:+5,chen:+3,riki:-4,sniper:-3,phantom_assassin:-2,bloodseeker:-2},// Immortal
};
let curRank=0;
function selRank(btn,idx){
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('a'));
  btn.classList.add('a');
  curRank=idx;
  renderMeta();
}
function getWR(h){
  const adj=RANK_ADJ[curRank]||{};
  return Math.round((h.wr+(adj[h.k]||0))*100)/100;
}
function renderMeta(){
  const c=document.getElementById('meta');
  const rankNames=["","Herald","Guardian","Crusader","Archon","Legend","Ancient","Divine","Immortal"];
  const rankLabel=curRank>0?` • ${rankNames[curRank]}`:'';
  c.innerHTML=Object.entries(ROLES).map(([r,info])=>{
    const heroes=H.filter(h=>h.rl===r).map(h=>({...h,adjWr:getWR(h)})).sort((a,b)=>b.adjWr-a.adjWr).slice(0,5);
    return `<div class="st"><span>${info.i}</span> ${info.l}<span class="pb">7.41a${rankLabel}</span></div>
    <div class="hg">${heroes.map(h=>`<div class="hc" onclick="showH('${h.k}')">
      <div class="ha"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0" loading="lazy"></div>
      <div class="hn">${h.n}</div>
      <div class="hw ${wc(h.adjWr)}">${h.adjWr}%</div>
    </div>`).join('')}</div>`;
  }).join('');
}

// ===== DRAFTER =====
let D={r:[null,null,null,null,null],d:[null,null,null,null,null],t:'r',s:null};
function sdt(t){D.t=t;document.querySelectorAll('#p-draft .mb').forEach((b,i)=>b.classList.toggle('a',(i===0&&t==='r')||(i===1&&t==='d')))}
function rsl(){
  ['r','d'].forEach(t=>{
    document.getElementById(t+'s').innerHTML=D[t].map((h,i)=>{
      if(h)return`<div class="sl f" onclick="D.t='${t}';D.s=${i}"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0"><button class="x" onclick="event.stopPropagation();D['${t}'][${i}]=null;rsl();rdh();urec()">×</button></div>`;
      return`<div class="sl" onclick="D.t='${t}';D.s=${i}">+</div>`;
    }).join('');
  });
}
function pkd(){return[...D.r,...D.d].filter(Boolean).map(h=>h.k)}
function rdh(){
  const s=document.getElementById('dsrch').value.toLowerCase(),p=pkd();
  document.getElementById('dhg').innerHTML=H.filter(h=>h.n.toLowerCase().includes(s)).map(h=>
    `<button class="sp${p.includes(h.k)?' pk':''}" onclick="pickH('${h.k}')"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0" loading="lazy"></button>`
  ).join('');
}
function pickH(k){
  const h=byK(k);if(!h)return;let s=D.s;
  if(s===null||D[D.t][s])s=D[D.t].indexOf(null);
  if(s===-1)return;D[D.t][s]=h;D.s=null;rsl();rdh();urec();
}
function urec(){
  const el=document.getElementById('drec'),rl=document.getElementById('rl');
  const et=D.t==='r'?'d':'r',enemies=D[et].filter(Boolean),allies=D[D.t].filter(Boolean),p=pkd();
  if(!enemies.length&&!allies.length){el.style.display='none';return}
  el.style.display='block';
  const av=H.filter(h=>!p.includes(h.k));
  const sc=av.map(h=>{
    let s=h.wr,rs=[];
    enemies.forEach(e=>{if(e.cnt.some(c=>h.n.includes(c)||c.includes(h.n.split(' ')[0]))){s+=5;rs.push('контрит '+e.n.split(' ')[0])}});
    allies.forEach(a=>{if(a.syn.some(c=>h.n.includes(c)||c.includes(h.n.split(' ')[0]))){s+=4;rs.push('синергия с '+a.n.split(' ')[0])}});
    return{...h,s,rs};
  }).sort((a,b)=>b.s-a.s).slice(0,5);
  rl.innerHTML=sc.map(h=>`<div class="rh">
    <div class="ri"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0"></div>
    <div style="flex:1;min-width:0"><div class="rn">${h.n}</div><div class="rr">${h.rs.length?h.rs.join(', '):'Высокий WR в мете'}</div></div>
    <div class="rw">${h.wr}%</div>
  </div>`).join('');
}

// ===== QUIZ — FIXED: role matching is now the PRIMARY factor =====
const QZ=[
  {q:"Какой стиль игры тебе ближе?",o:[
    {t:"🗡️ Бить сильно, убивать быстро",tg:{burst:3,damage:2}},
    {t:"🛡️ Танчить и инициировать",tg:{tank:3,initiator:2}},
    {t:"🧠 Хитрить и перехитрить",tg:{versatile:2,mobility:2,combo:1}},
    {t:"💚 Помогать команде",tg:{heal:3,save:2,aura:1}},
  ]},
  {q:"Ближний или дальний бой?",o:[
    {t:"⚔️ Ближний — в гущу!",tg:{melee:2,initiator:1}},
    {t:"🏹 Дальний — безопаснее",tg:{ranged:2,burst:1}},
  ]},
  {q:"Что важнее в бою?",o:[
    {t:"💥 Мгновенный урон",tg:{burst:3}},
    {t:"🔒 Контроль врагов",tg:{disable:3,catch:1}},
    {t:"🏃 Мобильность",tg:{mobility:3,ganker:1}},
    {t:"📈 Фарм и лейтгейм",tg:{farm:3,lategame:2}},
  ]},
  {q:"Одиночка или командный?",o:[
    {t:"🐺 Сам за себя",tg:{farm:2,mobility:1,split:1}},
    {t:"🤝 Вместе сильнее",tg:{teamfight:3,aura:1,heal:1}},
  ]},
  {q:"Какая роль ближе всего?",o:[
    {t:"⚔️ Керри — нести игру на себе",tg:{_role:"carry"}},
    {t:"🎯 Мидер — доминировать на линии",tg:{_role:"mid"}},
    {t:"🛡️ Оффлейн — давить и инициировать",tg:{_role:"offlane"}},
    {t:"🔮 Саппорт 4 — роумить и ганкать",tg:{_role:"sup4"}},
    {t:"💚 Саппорт 5 — защищать и помогать",tg:{_role:"sup5"}},
  ]},
];
let qst={step:0,tags:{},role:null};
function rqz(){
  const c=document.getElementById('qz');
  if(qst.step>=QZ.length){showQR();return}
  const q=QZ[qst.step];
  c.innerHTML=`<div class="qc">
    <div class="qp">${QZ.map((_,i)=>`<div class="qd${i<qst.step?' dn':i===qst.step?' cu':''}"></div>`).join('')}</div>
    <div class="qq">${q.q}</div>
    ${q.o.map((o,i)=>`<button class="qo" onclick="aqz(${i})">${o.t}</button>`).join('')}
  </div>`;
}
function aqz(i){
  const q=QZ[qst.step],opt=q.o[i];
  if(opt.tg._role){qst.role=opt.tg._role}
  else{Object.entries(opt.tg).forEach(([k,v])=>{qst.tags[k]=(qst.tags[k]||0)+v})}
  qst.step++;rqz();
}
function showQR(){
  const scored=H.map(h=>{
    let sc=0;
    // Role is the MAIN factor (weight 15)
    if(qst.role && h.rl===qst.role) sc+=15;
    // Tag matching
    Object.entries(qst.tags).forEach(([tag,w])=>{if(h.tags.includes(tag))sc+=w});
    // Small bonus for high WR
    sc += (h.wr-50)*0.3;
    return{...h,sc};
  }).sort((a,b)=>b.sc-a.sc);
  const best=scored[0],runners=scored.slice(1,4);
  const descs={carry:"Прирождённый керри! Фармишь, растёшь и решаешь игру.",mid:"Доминируешь на миде и задаёшь темп всей игре!",offlane:"Стена, инициатор, лидер — враги ломаются о тебя.",sup4:"Теневой герой, создающий хаос для врага.",sup5:"Сердце команды. Без тебя победы не будет."};
  document.getElementById('qz').innerHTML=`<div class="qc qres">
    <div class="qrh"><img src="${IMG(best.k)}" onerror="imgErr(this,'${best.k}')" data-try="0"></div>
    <div class="qrn">${best.n}</div>
    <div class="qrd">${descs[best.rl]||"Отличный выбор для твоего стиля!"}</div>
    <div style="text-align:left;margin-bottom:14px">
      <div style="font-size:11px;color:var(--txt2);margin-bottom:6px">Также подойдут:</div>
      ${runners.map(h=>`<div class="rh"><div class="ri"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0"></div><div style="flex:1"><div class="rn">${h.n}</div></div><div class="rw">${h.wr}%</div></div>`).join('')}
    </div>
    <button class="qrb" onclick="qst={step:0,tags:{},role:null};rqz()">ПРОЙТИ ЗАНОВО</button>
  </div>`;
}

// ===== ALL HEROES =====
function rah(){
  const s=document.getElementById('hsrch').value.toLowerCase();
  const f=H.filter(h=>h.n.toLowerCase().includes(s));
  document.getElementById('hcnt').textContent=f.length+' / '+H.length;
  document.getElementById('ahg').innerHTML=f.map(h=>`<div class="ac" onclick="showH('${h.k}')">
    <img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0" loading="lazy">
    <div class="acn">${h.n}</div>
    <div class="acw" style="color:var(--${wc(h.wr)==='h'?'green':wc(h.wr)==='m'?'gold':'red'})">${h.wr}%</div>
  </div>`).join('');
}

// ===== POPUP =====
function showH(k){
  const h=byK(k);if(!h)return;
  const rl=ROLES[h.rl]?ROLES[h.rl].l:h.rl;
  const an={str:'Сила',agi:'Ловкость',int:'Интеллект',uni:'Универсал'};
  document.getElementById('ppc').innerHTML=`
    <button class="pc" onclick="document.getElementById('pop').classList.remove('v')">✕</button>
    <div class="ph"><div class="pm"><img src="${IMG(h.k)}" onerror="imgErr(this,'${h.k}')" data-try="0"></div>
    <div class="pi"><h3>${h.n}</h3><div class="pr">${rl}</div><div class="pa">${an[h.a]||h.a}</div></div></div>
    <div class="pst"><div class="psi"><div class="psl">Винрейт</div><div class="psv" style="color:var(--${wc(h.wr)==='h'?'green':wc(h.wr)==='m'?'gold':'red'})">${h.wr}%</div></div>
    <div class="psi"><div class="psl">Пикрейт</div><div class="psv">${h.pr}%</div></div></div>
    <div class="psub">Контрится</div><div class="ptg">${h.cnt.map(c=>`<span class="pt">❌ ${c}</span>`).join('')}</div>
    <div class="psub">Синергия</div><div class="ptg">${h.syn.map(s=>`<span class="pt">✅ ${s}</span>`).join('')}</div>
  `;
  document.getElementById('pop').classList.add('v');
}

// ===== NAV =====
function sp(p){
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('a'));
  document.getElementById('p-'+p).classList.add('a');
  document.querySelectorAll('.nb').forEach((b,i)=>b.classList.toggle('a',['meta','draft','quiz','heroes'][i]===p));
}

// ===== TELEGRAM =====
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.expand();Telegram.WebApp.ready()}}catch(e){}

// ===== INIT =====
initRF();renderMeta();rsl();rdh();rqz();rah();
</script>
